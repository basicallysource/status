name: deploy

# A tag ships; nothing else does. Pushing to main runs the tests and stops
# there, so the thing that watches everything else is not itself changed by a
# stray commit — deciding to deploy is a separate act from writing the code.
on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

# One deploy at a time, and never cancel one in flight: a half-applied worker is
# worse than a queued one.
concurrency:
  group: deploy
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run check

  deploy:
    needs: check
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

      # Deploying is not the same as working. The worker answers on a custom
      # domain, so a green deploy step with a broken route is a thing that can
      # happen, and this is the cheapest possible way to find out.
      - name: verify it answers
        run: |
          for i in $(seq 1 10); do
            if curl -fsS --max-time 10 https://status.basically.website/healthz | grep -q '"ok": true'; then
              echo "live"; exit 0
            fi
            sleep 6
          done
          echo "deployed, but https://status.basically.website/healthz never came back ok" >&2
          exit 1
